<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>esp32-canboard - Config</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0.6em 1.2em;
      }
      .header-stack {
        display: flex;
        flex-direction: column;
        gap: 0.45em;
        margin-bottom: 0.8em;
      }
      .header-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1em;
        flex-wrap: wrap;
      }
      .title-block {
        display: flex;
        flex-direction: column;
        gap: 0.25em;
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75em;
        flex-wrap: wrap;
      }
      h2 {
        margin: 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 2em;
        table-layout: fixed;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 0.35em 0.4em;
        text-align: left;
      }
      /* Center the Input (1st) and Pullup header (4th) */
      th:nth-child(1),
      td:nth-child(1) {
        text-align: center;
      }
      th:nth-child(4) {
        text-align: center;
      }
      /* Center voltage/pressure headers (7-12) */
      th:nth-child(7),
      th:nth-child(8),
      th:nth-child(9),
      th:nth-child(10),
      th:nth-child(11),
      th:nth-child(12),
      th:nth-child(13) {
        text-align: center;
      }
      td:nth-child(12),
      td:nth-child(13) {
        text-align: center;
      }
      /* Allow Pullup input to fill its cell but align value to the right */
      td:nth-child(4) input {
        text-align: right;
        width: 100%;
        box-sizing: border-box;
      }
      /* Center the Filtering column (6th) and its checkboxes */
      th:nth-child(6),
      td:nth-child(6) {
        text-align: center;
      }
      td:nth-child(6) input {
        transform: scale(1.1);
      }
      .unit-wrap {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 0.25em;
      }
      .unit {
        font-size: 0.9rem;
        color: #333;
      }
      .unit-wrap input {
        text-align: right;
      }
      /* Remove numeric up/down controls for inputs where we don't want spinners */
      input.no-spin::-webkit-outer-spin-button,
      input.no-spin::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input.no-spin {
        -moz-appearance: textfield;
      }
      th {
        background: #f0f0f0;
      }
      input,
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 0.95rem;
        padding: 0.25em;
      }
      .top-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5em;
        flex-wrap: wrap;
      }
      .action-btn {
        background: #337ab7;
        color: #fff;
        border: none;
        padding: 0.35em 0.9em;
        font-size: 0.95rem;
        border-radius: 4px;
        cursor: pointer;
        height: 36px;
      }
      .action-btn.negative {
        background: #d9534f;
      }
      .action-btn.backup {
        background: #f39c12;
        color: #fff;
      }
      .action-btn.backup:hover {
        background: #e08e0f;
      }
      .action-btn.restore {
        background: #27ae60;
        color: #fff;
      }
      .action-btn.restore:hover {
        background: #229954;
      }
      .action-btn:disabled {
        background: #aaa;
        cursor: not-allowed;
      }
      .controls-inline {
        display: flex;
        align-items: center;
        gap: 0.75em;
        flex-wrap: wrap;
      }
      .header-controls {
        margin-right: 0;
      }
      .generic-controls {
        justify-content: flex-start;
      }
      .transport-controls {
        align-items: flex-start;
        justify-content: flex-start;
        flex-direction: column;
        gap: 0.35em;
        padding: 0.45em 0;
        border-top: 1px solid #ddd;
        border-bottom: 1px solid #ddd;
        width: 100%;
      }
      .section-label {
        font-weight: 700;
      }
      .transport-option-row {
        display: flex;
        align-items: center;
        gap: 0.75em;
        flex-wrap: wrap;
      }
      .transport-control {
        display: flex;
        align-items: center;
        gap: 0.35em;
      }
      .transport-control input[type="checkbox"] {
        width: auto;
        transform: scale(1.05);
      }
      .can-setting,
      .tx-setting,
      .espnow-setting,
      .gps-setting,
      .generic-setting {
        display: flex;
        align-items: center;
        gap: 0.25em;
      }
      .small-select {
        width: 12ch;
      }
      .hex-input {
        width: 6ch;
      }
      .mac-input {
        width: 18ch;
        text-transform: uppercase;
      }
      .scan-status {
        color: #555;
        font-size: 0.9rem;
      }
      .ble-scan-results {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4em;
      }
      .ble-device-btn {
        border: 1px solid #bbb;
        background: #fff;
        color: #222;
        border-radius: 4px;
        padding: 0.25em 0.45em;
        cursor: pointer;
        font-size: 0.88rem;
        height: 30px;
      }
      .ble-device-btn:hover {
        border-color: #337ab7;
      }
      .small-input {
        width: 5.5ch;
      }
      .hex-prefix {
        margin-right: 0.2em;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        z-index: 9999;
      }
      .overlay-card {
        min-width: 260px;
        max-width: 420px;
        padding: 1rem 1.25rem;
        border-radius: 8px;
        background: #fff;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }
      .spinner {
        width: 20px;
        height: 20px;
        border: 3px solid #d0d0d0;
        border-top-color: #337ab7;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        flex: 0 0 auto;
      }
      .overlay-text {
        font-size: 0.98rem;
        color: #222;
      }
      .toast {
        position: fixed;
        bottom: 14px;
        right: 14px;
        min-width: 220px;
        max-width: 380px;
        padding: 0.65rem 0.85rem;
        border-radius: 6px;
        color: #222;
        background: #fff;
        border: 1px solid #9a9a9a;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
        z-index: 10000;
        font-size: 0.94rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .toast.error {
        border-color: #e7b1af;
      }
      .toast.success {
        border-color: #b8dcbc;
      }
      .toast-icon {
        display: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #27ae60;
        color: #fff;
        font-size: 0.75rem;
        line-height: 18px;
        text-align: center;
        flex: 0 0 18px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <form id="config-form">
      <div class="header-stack">
        <div class="header-row">
          <div class="title-block">
            <h2>CANBoard Configuration</h2>
          </div>
          <div class="top-actions">
            <div class="controls-inline header-controls generic-controls">
              <span class="generic-setting">
                <label for="pullup-vref">vRef:</label>
                <span style="display: flex; align-items: center; gap: 0.25em">
                  <input
                    id="pullup-vref"
                    name="pullup_vref_mv"
                    class="small-input no-spin"
                    type="number"
                    disabled
                    readonly
                  />
                  <span class="unit">mV</span>
                </span>
              </span>
              <span class="generic-setting">
                <label for="pullup-vref-divider-high-ohm"
                  >Vref Divider High:</label
                >
                <span style="display: flex; align-items: center; gap: 0.25em">
                  <input
                    id="pullup-vref-divider-high-ohm"
                    name="pullup_vref_divider_high_ohm"
                    class="small-input no-spin"
                    type="number"
                    min="0"
                    max="20000"
                    value="5850"
                  />
                  <span class="unit">Ω</span>
                </span>
              </span>
              <span class="tx-setting">
                <label for="can-tx-rate">TX:</label>
                <select id="can-tx-rate" name="can_tx_hz" class="small-select">
                  <option value="25">25Hz</option>
                  <option value="50">50Hz</option>
                </select>
              </span>
              <span class="tx-setting">
                <label for="base-can-id">Base CAN ID:</label>
                <span style="display: flex; align-items: center">
                  <span class="hex-prefix">0x</span>
                  <input
                    id="base-can-id"
                    name="can_start_id"
                    class="hex-input"
                    maxlength="3"
                    value="100"
                  />
                </span>
              </span>
            </div>
            <button id="save-btn" class="action-btn" type="submit">
              Save Config
            </button>
            <button id="backup-btn" class="action-btn backup" type="button">
              Backup
            </button>
            <input
              id="restore-file"
              type="file"
              accept="application/json"
              style="display: none"
            />
            <button id="restore-btn" class="action-btn restore" type="button">
              Restore
            </button>
            <button id="reboot-btn" class="action-btn negative" type="button">
              Reboot Device
            </button>
          </div>
        </div>
        <div class="settings-row">
          <div class="controls-inline header-controls transport-controls">
            <span class="section-label">Transmission Options</span>
            <div class="transport-option-row">
              <label class="transport-control" for="can-enabled">
                <input
                  id="can-enabled"
                  name="can_enabled"
                  type="checkbox"
                  checked
                />
                <span>CAN</span>
              </label>

              <span class="can-setting">
                <label for="can-speed">CAN Speed:</label>
                <select
                  id="can-speed"
                  name="can_speed_kbps"
                  class="small-select"
                >
                  <option value="125">125kbps</option>
                  <option value="250">250kbps</option>
                  <option value="500">500kbps</option>
                  <option value="1000">1000kbps</option>
                </select>
              </span>
            </div>
            <div class="transport-option-row">
              <label class="transport-control" for="espnow-enabled">
                <input
                  id="espnow-enabled"
                  name="espnow_enabled"
                  type="checkbox"
                />
                <span>ESP-NOW</span>
              </label>

              <span class="espnow-setting">
                <label for="espnow-target-mac">Target MAC:</label>
                <input
                  id="espnow-target-mac"
                  name="espnow_target_mac"
                  class="mac-input"
                  maxlength="17"
                  pattern="(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}|[0-9A-Fa-f]{12}"
                  title="Enter a MAC address such as AA:BB:CC:DD:EE:FF"
                  placeholder="AA:BB:CC:DD:EE:FF"
                />
              </span>

              <label
                id="can-relay-espnow-control"
                class="transport-control espnow-setting"
                for="can-relay-espnow-enabled"
              >
                <input
                  id="can-relay-espnow-enabled"
                  name="can_relay_espnow_enabled"
                  type="checkbox"
                />
                <span>Relay CAN bus</span>
              </label>
            </div>
            <div class="transport-option-row">
              <label class="transport-control" for="gps-enabled">
                <input id="gps-enabled" name="gps_enabled" type="checkbox" />
                <span>GPS</span>
              </label>

              <span class="gps-setting">
                <label for="gps-can-start-id">GPS Start ID:</label>
                <span style="display: flex; align-items: center">
                  <span class="hex-prefix">0x</span>
                  <input
                    id="gps-can-start-id"
                    name="gps_can_start_id"
                    class="hex-input"
                    maxlength="3"
                    value="650"
                  />
                </span>
              </span>

              <span class="gps-setting">
                <label for="gps-target-mac">BLE MAC:</label>
                <input
                  id="gps-target-mac"
                  name="gps_target_mac"
                  class="mac-input"
                  maxlength="17"
                  pattern="(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}|[0-9A-Fa-f]{12}"
                  title="Enter a MAC address such as AA:BB:CC:DD:EE:FF"
                  placeholder="AA:BB:CC:DD:EE:FF"
                />
              </span>

              <button id="ble-scan-btn" class="action-btn gps-setting" type="button">
                Scan BLE
              </button>
              <span id="ble-scan-status" class="scan-status gps-setting"></span>
            </div>
            <div id="ble-scan-results" class="ble-scan-results gps-setting"></div>
          </div>
        </div>
      </div>
      <table>
        <colgroup>
          <col style="width: 5%" />
          <!-- Channel -->
          <col />
          <!-- Name (flexible) -->
          <col style="width: 8%" />
          <!-- Sensor Type -->
          <col style="width: 9%" />
          <!-- EMUB TX -->
          <col style="width: 6%" />
          <!-- Pullup -->
          <col style="width: 12%" />
          <!-- NTC Table -->
          <col style="width: 6%" />
          <!-- Filtering -->
          <col style="width: 6%" />
          <!-- Pressure Min mV -->
          <col style="width: 6%" />
          <!-- Pressure Max mV -->
          <col style="width: 6%" />
          <!-- Pressure Min kPa -->
          <col style="width: 6%" />
          <!-- Pressure Max kPa -->
          <col style="width: 6%" />
          <!-- Voltage -->
          <col style="width: 6%" />
          <!-- Value -->
        </colgroup>
        <thead>
          <tr>
            <th>Input</th>
            <th>Name</th>
            <th>Sensor Type</th>
            <th>EMU Black TX</th>
            <th>Pullup</th>
            <th>NTC Table</th>
            <th>Filtering</th>
            <th>Voltage Min</th>
            <th>Voltage Max</th>
            <th>Pressure Min</th>
            <th>Pressure Max</th>
            <th>Voltage</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody id="channels-tbody">
          <!-- JS will populate rows -->
        </tbody>
      </table>
    </form>
    <div id="status-toast" class="toast" role="status" aria-live="polite">
      <span id="status-toast-icon" class="toast-icon">✓</span>
      <span id="status-toast-text"></span>
    </div>
    <div
      id="loading-overlay"
      class="overlay"
      aria-live="polite"
      aria-busy="true"
    >
      <div class="overlay-card" role="status">
        <div class="spinner"></div>
        <div id="overlay-text" class="overlay-text">Working...</div>
      </div>
    </div>
    <script>
      const SENSOR_TYPES = ["Raw", "NTC", "Pressure"];
      const EMUB_TX_OPTIONS = [
        "Disabled",
        "CAN Analog 9",
        "CAN Analog 10",
        "CAN Analog 11",
        "CAN Analog 12",
        "CAN Analog 13",
        "CAN Analog 14",
        "CAN Analog 15",
        "CAN Analog 16",
      ];
      const NTC_TABLES = [
        "Bosch 0280130026",
        "Bosch TMAP 0281002437",
        "Universal 1/8 NPT",
        "FAE 33166",
        "Bosch 0280130055",
        "Custom NTC",
      ];
      let config = null;
      const loadingOverlay = document.getElementById("loading-overlay");
      const overlayText = document.getElementById("overlay-text");
      const statusToast = document.getElementById("status-toast");
      const statusToastIcon = document.getElementById("status-toast-icon");
      const statusToastText = document.getElementById("status-toast-text");
      let toastTimer = null;

      function showOverlay(message) {
        if (overlayText) {
          if (message) {
            overlayText.style.display = "";
            overlayText.textContent = message;
          } else {
            overlayText.style.display = "none";
            overlayText.textContent = "";
          }
        }
        if (loadingOverlay) loadingOverlay.style.display = "flex";
      }

      function hideOverlay() {
        if (loadingOverlay) loadingOverlay.style.display = "none";
      }

      function setStatus(message, isError, withSuccessIcon) {
        if (!statusToast || !statusToastText || !message) return;
        statusToastText.textContent = message;
        if (statusToastIcon) {
          statusToastIcon.style.display = withSuccessIcon
            ? "inline-block"
            : "none";
        }
        statusToast.classList.remove("error", "success", "show");
        statusToast.classList.add(isError ? "error" : "success");
        void statusToast.offsetWidth;
        statusToast.classList.add("show");
        if (toastTimer) {
          clearTimeout(toastTimer);
        }
        toastTimer = setTimeout(
          () => {
            statusToast.classList.remove("show");
          },
          isError ? 4500 : 2500,
        );
      }

      function normalizeMacAddress(value) {
        const cleaned = (value || "").trim().replace(/-/g, ":").toUpperCase();
        if (/^[0-9A-F]{12}$/.test(cleaned)) {
          return cleaned.match(/.{2}/g).join(":");
        }
        return cleaned;
      }

      function isValidMacAddress(value) {
        return /^([0-9A-F]{2}:){5}[0-9A-F]{2}$/.test(
          normalizeMacAddress(value),
        );
      }

      function parseCanIdInput(value, fallback) {
        const trimmed = (value || "").trim();
        if (/^0x/i.test(trimmed)) {
          return parseInt(trimmed, 16);
        }
        if (/^[0-9A-Fa-f]+$/.test(trimmed)) {
          return parseInt(trimmed, 16);
        }
        const dec = parseInt(trimmed);
        return isNaN(dec) ? fallback : dec;
      }

      function updateTransportControls() {
        const canEnabled = document.getElementById("can-enabled").checked;
        const espnowEnabled = document.getElementById("espnow-enabled").checked;
        const gpsEnabled = document.getElementById("gps-enabled").checked;
        const canRelayEspnow = document.getElementById(
          "can-relay-espnow-enabled",
        );
        const canRelayAvailable = espnowEnabled;
        if (!canRelayAvailable) canRelayEspnow.checked = false;
        const canBusActive = canEnabled || canRelayEspnow.checked;

        document.querySelectorAll(".can-setting").forEach((el) => {
          el.style.display = canBusActive ? "flex" : "none";
        });
        document.querySelectorAll(".espnow-setting").forEach((el) => {
          el.style.display = espnowEnabled ? "flex" : "none";
        });
        document.querySelectorAll(".gps-setting").forEach((el) => {
          el.style.display = gpsEnabled ? "flex" : "none";
        });

        const espnowMac = document.getElementById("espnow-target-mac");
        const gpsMac = document.getElementById("gps-target-mac");
        const canRelayEspnowControl = document.getElementById(
          "can-relay-espnow-control",
        );

        document.getElementById("can-speed").disabled = !canBusActive;
        espnowMac.disabled = !espnowEnabled;
        espnowMac.required = espnowEnabled;
        canRelayEspnowControl.style.display = canRelayAvailable
          ? "flex"
          : "none";
        canRelayEspnow.disabled = !canRelayAvailable;
        document.getElementById("gps-can-start-id").disabled = !gpsEnabled;
        gpsMac.disabled = !gpsEnabled;
        gpsMac.required = gpsEnabled;
        document.getElementById("ble-scan-btn").disabled = !gpsEnabled;
        if (!gpsEnabled) {
          document.getElementById("ble-scan-status").textContent = "";
          document.getElementById("ble-scan-results").innerHTML = "";
        }
      }

      function createRow(idx, ch) {
        const isNTC = ch.type == 1;
        const isPressure = ch.type == 2;
        return `<tr>
            <td style="text-align:center">${idx + 1}</td>
            <td><input name="name${idx}" maxlength="32" value="${ch.name || ""}" required></td>
            <td><select name="type${idx}">
                ${SENSOR_TYPES.map((t, i) => `<option value="${i}"${ch.type == i ? " selected" : ""}>${t}</option>`).join("")}
            </select></td>
            <td><select name="emubtx${idx}">
                ${EMUB_TX_OPTIONS.map((label, i) => `<option value="${i}"${(ch.emub_tx || 0) == i ? " selected" : ""}>${label}</option>`).join("")}
            </select></td>
            <td><div class="unit-wrap"><input name="pullup${idx}" class="no-spin" type="number" min="0" max="100000" value="${ch.pullup_ohms || 0}" ${isNTC ? "" : "disabled"}><span class="unit">Ω</span></div></td>
            <td><select name="ntc${idx}" ${isNTC ? "" : "disabled"}>
                ${NTC_TABLES.map((t, i) => `<option value="${i}"${ch.params?.ntc?.table_id == i ? " selected" : ""}>${t}</option>`).join("")}
            </select></td>
            <td><select name="filtering${idx}" ${isPressure ? "" : "disabled"}>
                    <option value="0"${ch.filtering == 0 ? " selected" : ""}>None</option>
                    <option value="1"${ch.filtering == 1 ? " selected" : ""}>Low</option>
                    <option value="2"${ch.filtering == 2 ? " selected" : ""}>Medium</option>
                    <option value="3"${ch.filtering == 3 ? " selected" : ""}>High</option>
                </select></td>
            <td><div class="unit-wrap"><input name="pminmv${idx}" class="no-spin" type="number" min="0" max="5000" value="${ch.params && ch.params.pressure && typeof ch.params.pressure.min_mv !== "undefined" ? ch.params.pressure.min_mv : ""}" ${isPressure ? "" : "disabled"}><span class="unit">mV</span></div></td>
            <td><div class="unit-wrap"><input name="pmaxmv${idx}" class="no-spin" type="number" min="0" max="5000" value="${ch.params && ch.params.pressure && typeof ch.params.pressure.max_mv !== "undefined" ? ch.params.pressure.max_mv : ""}" ${isPressure ? "" : "disabled"}><span class="unit">mV</span></div></td>
            <td><div class="unit-wrap"><input name="pminkpa${idx}" class="no-spin" type="number" step="0.01" value="${ch.params && ch.params.pressure && typeof ch.params.pressure.min_kpa !== "undefined" ? ch.params.pressure.min_kpa : ""}" ${isPressure ? "" : "disabled"}><span class="unit">kPa</span></div></td>
            <td><div class="unit-wrap"><input name="pmaxkpa${idx}" class="no-spin" type="number" step="0.01" value="${ch.params && ch.params.pressure && typeof ch.params.pressure.max_kpa !== "undefined" ? ch.params.pressure.max_kpa : ""}" ${isPressure ? "" : "disabled"}><span class="unit">kPa</span></div></td>
            <td><span id="live-voltage-${idx}">--</span></td>
            <td><span id="live-value-${idx}"></span></td>
        </tr>`;
      }

      function validateConfig(form) {
        let error = "";
        const canEnabled = document.getElementById("can-enabled").checked;
        const espnowEnabled = document.getElementById("espnow-enabled").checked;
        const canRelayEspnowEnabled = document.getElementById(
          "can-relay-espnow-enabled",
        ).checked;
        if (!canEnabled && !espnowEnabled) {
          error += "Enable CAN, ESP-NOW, or both. ";
        }
        if (
          espnowEnabled &&
          !isValidMacAddress(document.getElementById("espnow-target-mac").value)
        ) {
          error += "ESP-NOW target MAC invalid. ";
        }
        if (canRelayEspnowEnabled && !espnowEnabled) {
          error += "CAN relay requires ESP-NOW. ";
        }
        const gpsEnabled = document.getElementById("gps-enabled").checked;
        if (gpsEnabled) {
          if (
            !isValidMacAddress(document.getElementById("gps-target-mac").value)
          ) {
            error += "GPS BLE MAC invalid. ";
          }
          const gpsStartId = parseCanIdInput(
            document.getElementById("gps-can-start-id").value,
            NaN,
          );
          if (isNaN(gpsStartId) || gpsStartId < 0 || gpsStartId > 0x7fa) {
            error += "GPS Start ID must allow six 11-bit frames. ";
          }
        }
        const emubSelection = new Array(EMUB_TX_OPTIONS.length).fill(false);
        for (let i = 0; i < 10; ++i) {
          const name = form[`name${i}`].value.trim();
          if (!name) error += `Channel ${i + 1}: Name required. `;
          const pullup = parseInt(form[`pullup${i}`].value);
          if (isNaN(pullup) || pullup < 0 || pullup > 100000)
            error += `Channel ${i + 1}: Pullup invalid. `;
          const type = parseInt(form[`type${i}`].value);
          const emubTx = parseInt(form[`emubtx${i}`].value);
          if (isNaN(emubTx) || emubTx < 0 || emubTx > 8) {
            error += `Channel ${i + 1}: EMUB TX invalid. `;
          } else if (emubTx > 0) {
            if (emubSelection[emubTx]) {
              error += `Channel ${i + 1}: EMUB TX must be unique. `;
            } else {
              emubSelection[emubTx] = true;
            }
          }
          if (type === 1) {
            // NTC
            if (isNaN(parseInt(form[`ntc${i}`].value)))
              error += `Channel ${i + 1}: NTC table invalid. `;
          }
          if (type === 2) {
            // Pressure
            const minmv = parseInt(form[`pminmv${i}`].value);
            const maxmv = parseInt(form[`pmaxmv${i}`].value);
            const minkpa = parseFloat(form[`pminkpa${i}`].value);
            const maxkpa = parseFloat(form[`pmaxkpa${i}`].value);
            if (isNaN(minmv) || isNaN(maxmv) || minmv >= maxmv)
              error += `Channel ${i + 1}: Pressure mV min/max invalid. `;
            if (minmv < 0 || minmv > 5000 || maxmv < 0 || maxmv > 5000)
              error += `Channel ${i + 1}: Pressure mV must be 0-5000. `;
            if (isNaN(minkpa) || isNaN(maxkpa) || minkpa >= maxkpa)
              error += `Channel ${i + 1}: Pressure kPa min/max invalid. `;
            const lvl = parseInt(form[`filtering${i}`].value);
            if (isNaN(lvl) || lvl < 0 || lvl > 3)
              error += `Channel ${i + 1}: Filter level invalid. `;
          }
        }
        return error;
      }

      function fillTable() {
        const tbody = document.getElementById("channels-tbody");
        tbody.innerHTML = config.channels
          .map((ch, i) => createRow(i, ch))
          .join("");
        attachTypeHandlers();
        attachEmubTxHandlers();
      }

      function updateEmubTxOptions() {
        const selects = Array.from(
          document.querySelectorAll('select[name^="emubtx"]'),
        );
        const chosenValues = selects.map((sel) => parseInt(sel.value) || 0);
        selects.forEach((sel) => {
          const current = parseInt(sel.value) || 0;
          Array.from(sel.options).forEach((opt) => {
            const value = parseInt(opt.value) || 0;
            if (value === 0 || value === current) {
              opt.disabled = false;
            } else {
              opt.disabled = chosenValues.includes(value);
            }
          });
        });
      }

      function attachEmubTxHandlers() {
        const selects = Array.from(
          document.querySelectorAll('select[name^="emubtx"]'),
        );
        selects.forEach((sel) => {
          sel.onchange = updateEmubTxOptions;
        });
        updateEmubTxOptions();
      }

      function updateRowControls(i) {
        const typeSel = document.querySelector(`[name="type${i}"]`);
        if (!typeSel) return;
        const type = parseInt(typeSel.value);
        const isNTC = type === 1;
        const isPressure = type === 2;
        const ntc = document.querySelector(`[name="ntc${i}"]`);
        const pullup = document.querySelector(`[name="pullup${i}"]`);
        const pmin = document.querySelector(`[name="pminmv${i}"]`);
        const pmax = document.querySelector(`[name="pmaxmv${i}"]`);
        const kmin = document.querySelector(`[name="pminkpa${i}"]`);
        const kmax = document.querySelector(`[name="pmaxkpa${i}"]`);
        const filt = document.querySelector(`[name="filtering${i}"]`);
        if (ntc) ntc.disabled = !isNTC;
        if (pullup) pullup.disabled = !isNTC;
        if (pmin) pmin.disabled = !isPressure;
        if (pmax) pmax.disabled = !isPressure;
        if (kmin) kmin.disabled = !isPressure;
        if (kmax) kmax.disabled = !isPressure;
        if (filt) filt.disabled = !isPressure;
      }

      function attachTypeHandlers() {
        for (let i = 0; i < 10; ++i) {
          const sel = document.querySelector(`[name="type${i}"]`);
          if (!sel) continue;
          sel.onchange = () => updateRowControls(i);
          updateRowControls(i);
        }
      }

      async function loadConfig() {
        const res = await fetch("/api/config");
        config = await res.json();
        fillTable();
        // Set CAN speed dropdown
        document.getElementById("can-speed").value =
          config.can_speed_kbps || 500;
        // Set CAN TX rate dropdown
        document.getElementById("can-tx-rate").value =
          config.can_tx_hz === 50 ? 50 : 25;
        // Set base CAN ID (show hex without 0x prefix)
        const baseElem = document.getElementById("base-can-id");
        if (config.can_start_id !== undefined) {
          baseElem.value = config.can_start_id.toString(16).toUpperCase();
        }
        const pullupHighElem = document.getElementById(
          "pullup-vref-divider-high-ohm",
        );
        if (pullupHighElem)
          pullupHighElem.value =
            config.pullup_vref_divider_high_ohm !== undefined
              ? config.pullup_vref_divider_high_ohm
              : 5850;
        document.getElementById("can-enabled").checked =
          config.can_enabled !== false;
        document.getElementById("espnow-enabled").checked =
          config.espnow_enabled === true;
        document.getElementById("can-relay-espnow-enabled").checked =
          config.can_relay_espnow_enabled === true;
        document.getElementById("espnow-target-mac").value =
          normalizeMacAddress(config.espnow_target_mac || "");
        document.getElementById("gps-enabled").checked =
          config.gps_enabled === true;
        document.getElementById("gps-can-start-id").value = (
          config.gps_can_start_id !== undefined
            ? config.gps_can_start_id
            : 0x650
        )
          .toString(16)
          .toUpperCase();
        document.getElementById("gps-target-mac").value = normalizeMacAddress(
          config.gps_target_mac || "",
        );
        updateTransportControls();
        await refreshLiveValues();
      }

      async function refreshLiveValues() {
        try {
          const res = await fetch("/api/live_values", { cache: "no-store" });
          if (!res.ok) {
            throw new Error(`Live values HTTP ${res.status}`);
          }
          const live = await res.json();
          if (!live || !Array.isArray(live.channels)) {
            throw new Error("Live values payload is invalid");
          }

          const pullupElem = document.getElementById("pullup-vref");
          if (pullupElem && typeof live.derived_vref_mv === "number") {
            pullupElem.value = live.derived_vref_mv;
          }

          for (let i = 0; i < 10; ++i) {
            const ch = live.channels[i];
            if (!ch) continue;
            const voltageEl = document.getElementById(`live-voltage-${i}`);
            const valueEl = document.getElementById(`live-value-${i}`);

            if (voltageEl) {
              if (typeof ch.voltage_v === "number") {
                voltageEl.textContent = `${Math.round(ch.voltage_v * 1000)} mV`;
              } else {
                voltageEl.textContent = "--";
              }
            }

            if (valueEl) {
              valueEl.textContent = ch.value || "";
            }
          }
        } catch (e) {
          for (let i = 0; i < 10; ++i) {
            const voltageEl = document.getElementById(`live-voltage-${i}`);
            const valueEl = document.getElementById(`live-value-${i}`);
            if (voltageEl) voltageEl.textContent = "--";
            if (valueEl) valueEl.textContent = "";
          }
          if (window.console && console.warn) {
            console.warn("refreshLiveValues failed:", e);
          }
        }
      }

      document.getElementById("config-form").onsubmit = async function (e) {
        e.preventDefault();
        const form = e.target;
        const error = validateConfig(form);
        setStatus(error, true);
        if (error) return;
        // Build config object
        config.can_enabled = document.getElementById("can-enabled").checked;
        config.espnow_enabled =
          document.getElementById("espnow-enabled").checked;
        config.can_relay_espnow_enabled = document.getElementById(
          "can-relay-espnow-enabled",
        ).checked;
        config.espnow_target_mac = normalizeMacAddress(
          document.getElementById("espnow-target-mac").value,
        );
        config.gps_enabled = document.getElementById("gps-enabled").checked;
        config.gps_target_mac = normalizeMacAddress(
          document.getElementById("gps-target-mac").value,
        );
        config.gps_can_start_id = parseCanIdInput(
          document.getElementById("gps-can-start-id").value,
          config.gps_can_start_id !== undefined
            ? config.gps_can_start_id
            : 0x650,
        );
        config.can_speed_kbps = parseInt(
          document.getElementById("can-speed").value,
        );
        config.can_tx_hz =
          parseInt(document.getElementById("can-tx-rate").value) === 50
            ? 50
            : 25;
        // Read base CAN ID from hex input (allow decimal as fallback)
        const baseVal = document.getElementById("base-can-id").value.trim();
        config.can_start_id = parseCanIdInput(
          baseVal,
          config.can_start_id || 0x100,
        );
        for (let i = 0; i < 10; ++i) {
          config.channels[i].name = form[`name${i}`].value.trim();
          config.channels[i].pullup_ohms = parseInt(form[`pullup${i}`].value);
          config.channels[i].type = parseInt(form[`type${i}`].value);
          config.channels[i].filtering = parseInt(form[`filtering${i}`].value);
          config.channels[i].emub_tx = parseInt(form[`emubtx${i}`].value) || 0;
          config.channels[i].params = {};
          if (config.channels[i].type === 1) {
            config.channels[i].params.ntc = {
              table_id: parseInt(form[`ntc${i}`].value),
            };
          } else if (config.channels[i].type === 2) {
            config.channels[i].params.pressure = {
              min_mv: parseInt(form[`pminmv${i}`].value),
              max_mv: parseInt(form[`pmaxmv${i}`].value),
              min_kpa: parseFloat(form[`pminkpa${i}`].value),
              max_kpa: parseFloat(form[`pmaxkpa${i}`].value),
            };
          }
        }
        const pvh = parseInt(
          document.getElementById("pullup-vref-divider-high-ohm").value,
        );
        config.pullup_vref_divider_high_ohm = isNaN(pvh)
          ? config.pullup_vref_divider_high_ohm || 5850
          : pvh;
        try {
          const resp = await fetch("/api/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(config),
          });
          if (resp.ok) {
            setStatus("Config saved.", false, true);
          } else {
            setStatus("Failed to save config.", true);
          }
        } catch (e) {
          setStatus("Failed to save config.", true);
        }
      };

      document.getElementById("reboot-btn").onclick = async function () {
        let secondsLeft = 10;
        showOverlay(`Rebooting device... Refreshing in ${secondsLeft} seconds`);
        try {
          await fetch("/api/reboot", { method: "POST" });
        } catch (e) {
          // Ignore errors because reboot can drop HTTP connection abruptly
        }
        const countdown = setInterval(() => {
          secondsLeft -= 1;
          if (secondsLeft > 0) {
            showOverlay(
              `Rebooting device... Refreshing in ${secondsLeft} seconds`,
            );
            return;
          }
          clearInterval(countdown);
          showOverlay("Rebooting device... Refreshing now");
          window.location.reload();
        }, 1000);
      };

      // Backup (download JSON) — filename uses client time ddmmyy-hhmmss
      document.getElementById("backup-btn").onclick = async function () {
        try {
          const resp = await fetch("/api/config/export.json");
          if (!resp.ok) {
            setStatus("Failed to download config.", true);
            return;
          }
          const blob = await resp.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          const now = new Date();
          const pad = (n) => n.toString().padStart(2, "0");
          const dd = pad(now.getDate());
          const mm = pad(now.getMonth() + 1);
          const yy = pad(now.getFullYear() % 100);
          const hh = pad(now.getHours());
          const mi = pad(now.getMinutes());
          const ss = pad(now.getSeconds());
          const datetime = `${dd}${mm}${yy}-${hh}${mi}${ss}`; // ddmmyy-hhmmss
          a.download = `esp32-canboard-config-${datetime}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (e) {
          // No toast needed for backup flow
        }
      };

      // Restore (upload JSON)
      document.getElementById("restore-btn").onclick = function () {
        document.getElementById("restore-file").click();
      };

      document.getElementById("restore-file").onchange = async function (e) {
        const f = e.target.files[0];
        if (!f) return;
        if (
          !confirm(
            "Restore configuration from selected file? Existing config will be overwritten.",
          )
        )
          return;
        try {
          const text = await f.text();
          const resp = await fetch("/api/config/import.json", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: text,
          });
          if (resp.ok) {
            setTimeout(() => {
              window.location.reload();
            }, 900);
          } else {
            // No toast needed for restore flow
          }
        } catch (e) {
          // No toast needed for restore flow
        } finally {
          e.target.value = "";
        }
      };

      document.getElementById("can-enabled").onchange = updateTransportControls;
      document.getElementById("espnow-enabled").onchange =
        updateTransportControls;
      document.getElementById("can-relay-espnow-enabled").onchange =
        updateTransportControls;
      document.getElementById("gps-enabled").onchange = updateTransportControls;
      document.getElementById("espnow-target-mac").onblur = function (e) {
        e.target.value = normalizeMacAddress(e.target.value);
      };
      document.getElementById("gps-target-mac").onblur = function (e) {
        e.target.value = normalizeMacAddress(e.target.value);
      };
      document.getElementById("ble-scan-btn").onclick = async function () {
        const btn = document.getElementById("ble-scan-btn");
        const status = document.getElementById("ble-scan-status");
        const resultsEl = document.getElementById("ble-scan-results");
        btn.disabled = true;
        status.textContent = "Scanning...";
        resultsEl.innerHTML = "";
        try {
          const resp = await fetch("/api/ble/dragy_scan", { method: "POST" });
          if (!resp.ok) {
            throw new Error(`BLE scan HTTP ${resp.status}`);
          }
          const payload = await resp.json();
          const devices = Array.isArray(payload.devices)
            ? payload.devices
            : [];
          if (!devices.length) {
            status.textContent = "No likely Dragy devices found.";
            return;
          }
          status.textContent = `${devices.length} likely device${devices.length === 1 ? "" : "s"} found.`;
          devices.forEach((dev) => {
            const deviceBtn = document.createElement("button");
            deviceBtn.className = "ble-device-btn";
            deviceBtn.type = "button";
            deviceBtn.textContent = `${dev.name || "BLE"} ${normalizeMacAddress(dev.mac)} ${dev.rssi}dBm`;
            deviceBtn.onclick = () => {
              document.getElementById("gps-target-mac").value =
                normalizeMacAddress(dev.mac || "");
            };
            resultsEl.appendChild(deviceBtn);
          });
        } catch (e) {
          status.textContent = "BLE scan failed.";
        } finally {
          btn.disabled = !document.getElementById("gps-enabled").checked;
        }
      };
      updateTransportControls();
      loadConfig();
      setInterval(refreshLiveValues, 1000);
    </script>
  </body>
</html>
